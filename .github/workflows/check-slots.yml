name: Veille créneaux Stych

on:
  schedule:
    # Toutes les 5 minutes. NB : GitHub peut décaler l'exécution de quelques
    # minutes en période de forte charge — c'est normal et sans conséquence ici.
    - cron: "*/5 * * * *"
  workflow_dispatch:  # permet de lancer manuellement depuis l'onglet Actions

# On empêche deux exécutions de tourner en même temps (elles se marcheraient
# dessus sur le commit de l'état).
concurrency:
  group: check-slots
  cancel-in-progress: false

permissions:
  contents: write   # nécessaire pour re-committer state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les créneaux
        env:
          STYCH_EMAIL: ${{ secrets.STYCH_EMAIL }}
          STYCH_PASSWORD: ${{ secrets.STYCH_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Sauvegarder l'état + l'historique (si modifiés)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # On n'ajoute que les fichiers réellement présents : au premier
          # lancement, historique.csv n'existe pas encore (0 nouveau créneau).
          for f in state.json historique.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "Maj état + historique des créneaux [skip ci]"
            git push
          fi
