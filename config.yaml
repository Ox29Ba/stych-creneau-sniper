# =============================================================
#  Filtres du bot Stych Créneau Sniper.
#  TOUT est optionnel. Un critère vide (`[]` ou `null`) est ignoré.
#  Un créneau est notifié seulement s'il passe TOUS les critères.
#  Astuce : `python main.py --list-lieux` pour voir tous les lieux.
# =============================================================

filtres:
  # --- LIEU : Bussy, Montévrain (Val d'Europe), Lagny ---
  # (recherche insensible à la casse dans le nom de ville)
  departements: []
  villes: ["Bussy", "Montevrain", "Lagny"]
  codes_postaux: []
  arrets: []
  lieux_ids: []

  # --- DURÉE : tout (leçons 45 min ET créneaux 1h30) ---
  duree_min: null
  duree_max: null
  durees_exactes: []

  # --- CRÉDITS ---
  credits_max: null

  # --- JOURS : tous ---
  jours: []

  # --- PLAGE DE DATES : d'aujourd'hui jusqu'au 28 août 2026 ---
  date_debut: "2026-08-14"
  date_fin: "2026-08-28"

  # --- HORAIRE : n'importe quand ---
  heure_min: null
  heure_max: null

  # --- MONITEUR ---
  moniteurs: []

options:
  # N'alerter que pour les nouveaux créneaux (recommandé).
  seulement_nouveaux: true
  # Premier lancement : envoyer juste un résumé du nombre de créneaux.
  resume_au_premier_lancement: true
